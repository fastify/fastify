version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      include: "scope"
      prefix: "ci"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 10
    groups:
      fastify-owned:
        patterns:
          - "fastify/*"

  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      include: "scope"
      prefix: "build"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    versioning-strategy: "increase-if-necessary"
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    ignore:
      # TODO: remove ignore until neostandard support ESLint 10
      - dependency-name: "eslint"
      - dependency-name: "neostandard"
      - dependency-name: "@stylistic/*"
      - dependency-name: "typescript"  
    open-pull-requests-limit: 10
    groups:
      # Production dependencies with breaking changes
      dependencies:
        dependency-type: "production"
        patterns:
          - "*"
      # ESLint related dependencies
      dev-dependencies-eslint:
        patterns:
          - "eslint"
          - "neostandard"
          - "@stylistic/*"
      # TypeScript related dependencies
      dev-dependencies-typescript:
        patterns:
          - "@types/*"
          - "tstyche"
          - "typescript"
      # Ajv related dependencies
      dev-dependencies-ajv:
        patterns:
          - "ajv"
          - "ajv-*"
      # Catch-all development dependencies
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
