# See https://github.com/DavidAnson/markdownlint-cli2
config:
  # Disable all rules by default.
  default: false

  # Enforce line length.
  MD013:
    line_length: 80
    code_block_line_length: 120
    headings: false
    tables: false
    strict: false
    stern: false

  # Disallow trailing spaces (except 2 spaces for hard line breaks).
  MD009:
    br_spaces: 2
    strict: false
    list_item_empty_lines: false

globs:
  - '**/*.md'

ignores:
  - 'node_modules/**'
  - 'test/**/*.md'

noProgress: true
